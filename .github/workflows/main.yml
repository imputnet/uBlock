name: uBO release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # for creating release
    name: Build packages
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    env:
      HAS_CRX_KEY: ${{ secrets.CRX_SIGNING_KEY != '' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clone uAssets
        run: |
          tools/pull-assets.sh
      - name: Get release information
        run: |
          echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
      - name: Build MV2 packages
        run: |
          tools/make-chromium.sh ${{ env.VERSION }}
      - name: Install Rust
        if: env.HAS_CRX_KEY == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install omaha-publish
        if: env.HAS_CRX_KEY == 'true'
        run: |
          cargo install omaha-publish --version '^0.2' \
            --locked --no-default-features --features cli
      - name: Pack CRX
        if: env.HAS_CRX_KEY == 'true'
        run: |
          crx="dist/build/uBlock0_${VERSION}.chromium.crx"
          key="${RUNNER_TEMP:?}/crx.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$CRX_SIGNING_KEY" > "$key")
          omaha-publish pack --key "$key" dist/build/uBlock0.chromium "$crx"
        env:
          CRX_SIGNING_KEY: ${{ secrets.CRX_SIGNING_KEY }}
      - name: Assemble release notes
        run: |
          > release.body.txt
          grep -m1 -B10000 -- "----------" CHANGELOG.md >> release.body.txt
          sed -e 's/%version%/${{ env.VERSION }}/g' .github/workflows/RELEASE.HEAD.md >> release.body.txt
      - name: Create GitHub release
        uses: imputnet/immutable-release@v1
        with:
          notes-file: release.body.txt
          files: dist/build/uBlock0_${{ env.VERSION }}.chromium.*
